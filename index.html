<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Remove Background — Official API</title><link rel="stylesheet" href="/style.css"></head><body>
<header class="topbar"><a class="brand" href="/"><span class="brand-mark"></span><span>remove bg</span></a><div class="top-actions"><span class="api-badge">Official API</span><span class="credit-badge" id="creditBadge">API</span></div></header>
<main class="home-main"><section class="home-hero"><div class="home-copy"><div class="spark">✦</div><h1>Remove<br>Image<br>Background</h1><p>Powered by the official remove.bg API.</p>
<div class="setting-block"><span class="setting-title">QUALITY</span><div class="choice-row"><button class="choice active" data-quality="auto" type="button">Best</button><button class="choice" data-quality="preview" type="button">Free Preview</button></div></div>
<div class="setting-block"><span class="setting-title">SUBJECT</span><div class="choice-row wrap"><button class="choice active" data-subject="auto" type="button">Auto</button><button class="choice" data-subject="graphic" type="button">Graphic</button><button class="choice" data-subject="person" type="button">Person</button><button class="choice" data-subject="product" type="button">Product</button></div></div></div>
<div class="upload-column"><div class="upload-card" id="dropZone"><input id="fileInput" type="file" accept="image/png,image/jpeg,image/webp" hidden><button class="upload-button" id="uploadBtn" type="button">Upload Image</button><div class="upload-sub">or drop a file,</div><div class="upload-links"><button class="text-link" id="pasteBtn" type="button">paste image</button><span>or</span><button class="text-link" id="urlBtn" type="button">URL</button></div><div class="drop-hint">Drop image here</div></div><div class="home-note"><strong>Best</strong> uses <code>size=auto</code>. For glowing amount graphics such as RM1,475, try <strong>Graphic</strong>.</div></div></section></main>
<div class="modal hidden" id="urlModal"><div class="modal-backdrop" data-close-url></div><div class="modal-card"><button class="modal-close" data-close-url type="button">×</button><h3>Paste image URL</h3><p>remove.bg will download the image directly from this URL.</p><input id="urlInput" type="url" placeholder="https://example.com/image.jpg"><button class="upload-button full" id="urlGo" type="button">Remove background</button></div></div>
<div class="toast" id="toast"></div><script src="/common.js" defer></script><script src="/home.js" defer></script></body></html>
