<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Your image</title><link rel="stylesheet" href="/src/style.css"></head><body>
<header class="topbar"><a class="brand" href="/"><span class="brand-mark"></span><span>Background Remover</span></a><div class="top-actions"><span class="free-pill">100% Free</span><span class="engine-pill" id="engineBadge">Local AI</span></div></header>
<main class="result-main"><section class="result-shell"><div class="result-title-row"><div><p class="eyebrow">RESULT</p><h1>Your image</h1></div><div class="result-head-actions"><button class="secondary-btn" id="deleteBtn">Delete</button><input id="newFileInput" type="file" accept="image/*" hidden><button class="secondary-btn" id="newImageBtn">New image</button></div></div><div class="result-stats" id="resultStats"></div>
<article class="editor-card" id="editorCard"><div class="result-toolbar"><div class="mode-tabs"><button class="mode-tab active" data-mode="removed">Removed</button><button class="mode-tab" data-mode="original">Original</button><button class="mode-tab" data-mode="compare">Compare</button></div><div class="result-meta" id="resultName">image.png</div></div>
<div class="result-stage mode-removed" id="resultStage"><div class="single-view removed-view checkerboard"><img id="removedImage" alt="Removed background"></div><div class="single-view original-view"><img id="originalImage" alt="Original"></div><div class="compare-view"><img id="compareOriginal" alt=""><div class="compare-after checkerboard" id="compareAfter"><img id="compareRemoved" alt=""></div><div class="compare-line" id="compareLine"><span>↔</span></div><input class="compare-range" id="compareRange" type="range" min="0" max="100" value="50"></div></div>
<div class="result-actions"><button class="primary-action" id="downloadBtn">Download PNG</button><button class="secondary-action" id="copyBtn">Copy image</button></div></article></section>
<section class="history-section"><div class="section-head"><div><p class="eyebrow">RECENT</p><h2>Previous records</h2></div><button class="text-danger" id="clearAllBtn">Clear all</button></div><div class="history-empty" id="historyEmpty">No previous images yet.</div><div class="history-rail hidden" id="historyRail"></div></section></main>
<div class="toast" id="toast"></div><script type="module" src="/src/result.js"></script></body></html>
